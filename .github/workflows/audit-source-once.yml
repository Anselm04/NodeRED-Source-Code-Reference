name: Verify pinned Git source tree nodered
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/node-red/node-red.git
      upstream_sha: e4f7fc516cd8da1b4b4d571169cf6937b500bb30
      audit_slug: nodered
